descripcion: |
  Con poco más de 10 años, a Messi le detectaron un déficit de la hormona del crecimiento. El tratamiento costaba cerca de US$ 900 por mes y su familia no podía pagarlo. Esta es la historia de cómo una servilleta cambió el fútbol.


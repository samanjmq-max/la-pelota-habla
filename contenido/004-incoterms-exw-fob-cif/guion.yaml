descripcion: |
  ¿Quién pierde la mercadería si el barco se hunde? Lo define el Incoterm. Según las reglas Incoterms® 2020 de la ICC:
  · EXW: el vendedor pone la carga a disposición en su local, sin cargarla; carga, exportación y transporte corren por cuenta del comprador.
  · FOB: el vendedor despacha la exportación y el riesgo pasa cuando la carga está a bordo del barco en el puerto de embarque.
  · CIF: el vendedor paga flete y seguro mínimo (cláusula C) hasta el puerto de destino, pero el riesgo pasa al comprador a bordo, en origen.

  Dato extra: FOB y CIF son solo para transporte marítimo o fluvial. Para contenedores, la ICC recomienda FCA o CIP.

  Imágenes de stock: Ivan Mudruk, Glenn Langhorst, Eric Skaggs, Tima Miroshnichenko y Cyriac von Czapiewski (Pexels).


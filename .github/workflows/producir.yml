name: Producir videos
# Renderiza cada guion nuevo o modificado y deja el video como artefacto descargable.
# La subida a YouTube se agrega cuando el propietario autorice el acceso al canal.
on:
  push:
    paths: ["contenido/**/guion.yaml", "pipeline/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
          pip install -q -r requirements.txt
      - name: Modelo de voz (cache)
        uses: actions/cache@v4
        with: { path: modelos, key: kokoro-v1.0 }
      - name: Descargar modelo de voz si falta
        run: |
          mkdir -p modelos
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f modelos/kokoro-v1.0.onnx ] || curl -sSL -o modelos/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f modelos/voices-v1.0.bin ] || curl -sSL -o modelos/voices-v1.0.bin $base/voices-v1.0.bin
      - name: Renderizar guiones cambiados
        run: |
          cambios=$(git diff --name-only HEAD~1 HEAD -- 'contenido/*/guion.yaml' 2>/dev/null || true)
          [ -z "$cambios" ] && cambios=$(ls contenido/*/guion.yaml)
          for g in $cambios; do python pipeline/producir.py "$(dirname "$g")"; done
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: contenido/*/salida/
          retention-days: 14
      - name: Guardar videos en la rama "videos"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/v
          for d in contenido/*/salida; do [ -f "$d/short.mp4" ] && cp "$d/short.mp4" "/tmp/v/$(basename "$(dirname "$d")").mp4"; done
          git fetch origin videos 2>/dev/null || true
          if git rev-parse --verify -q origin/videos >/dev/null; then git checkout -B videos origin/videos; else git checkout --orphan videos && git rm -rqf . ; fi
          cp /tmp/v/*.mp4 .
          git add ./*.mp4
          git commit -m "Videos renderizados $(date -u +%F)" || exit 0
          git push origin videos

name: Producir videos
# Renderiza cada guion nuevo o modificado y deja el video como artefacto descargable.
# La subida a YouTube se agrega cuando el propietario autorice el acceso al canal.
on:
  push:
    paths: ["contenido/**/guion.yaml", "pipeline/**"]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
          pip install -q -r requirements.txt
      - name: Modelo de voz (cache)
        uses: actions/cache@v4
        with: { path: modelos, key: kokoro-v1.0 }
      - name: Descargar modelo de voz si falta
        run: |
          mkdir -p modelos
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f modelos/kokoro-v1.0.onnx ] || curl -sSL -o modelos/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f modelos/voices-v1.0.bin ] || curl -sSL -o modelos/voices-v1.0.bin $base/voices-v1.0.bin
      - name: Renderizar guiones cambiados
        run: |
          cambios=$(git diff --name-only HEAD~1 HEAD -- 'contenido/*/guion.yaml' 2>/dev/null || true)
          [ -z "$cambios" ] && cambios=$(ls contenido/*/guion.yaml)
          for g in $cambios; do python pipeline/producir.py "$(dirname "$g")"; done
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: contenido/*/salida/
          retention-days: 14
